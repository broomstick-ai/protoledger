[package]
name = "protoledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A harness-neutral, append-only ledger format for coding-agent threads, with lossless-as-possible import/export for Claude Code, Codex, opencode and more."
license = "MIT OR Apache-2.0"
authors = ["Sam Haaf <samhaaf@gmail.com>"]
repository = "https://github.com/broomstick-ai/protoledger"
homepage = "https://github.com/broomstick-ai/protoledger"
readme = "README.md"
keywords = ["agents", "transcript", "claude-code", "codex", "opencode"]
categories = ["command-line-utilities", "encoding"]
documentation = "https://docs.rs/protoledger"
# The published crate is the library, the binary and their docs. The fixtures
# (11 MB, over crates.io's 10 MB limit), tests/ and tests/reports/ stay in the
# repository: the conformance suite ratchets against reports committed in git,
# which a packaged crate does not have. An allow-list rather than `exclude`,
# so nothing new (.work-dag/, scratch files) is shipped by accident; cargo
# ignores `exclude` when `include` is set.
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "SPEC.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "docs/**/*.md"]

[lib]
name = "protoledger"
path = "src/lib.rs"

[[bin]]
name = "protoledger"
path = "src/bin/protoledger.rs"
# clap is the binary's alone: the library never depends on it.
required-features = ["cli"]

[features]
default = ["cli", "sqlite", "zstd", "store", "sync", "serve"]
# The `protoledger` binary (and its argument parser, clap). A library
# dependent turns default features off and never builds clap.
cli = ["dep:clap"]
# Formats whose native store is SQLite (opencode >= 1.2, cursor, ...).
sqlite = ["dep:rusqlite"]
# Codex compresses old rollouts to .jsonl.zst.
zstd = ["dep:zstd"]
# A store directory: ledgers plus a rebuildable SQLite index (SPEC §9), whose
# ledgers may be kept compressed (SPEC §10).
store = ["dep:rusqlite", "dep:zstd"]
# Bindings followed by sync: project/attach/unbind and a watcher (SPEC §9.2, §9.3).
sync = ["store", "dep:notify"]
# `protoledger serve`: the store over HTTP and a WebSocket (docs/SERVE.md).
# The only feature that pulls in tokio.
serve = ["sync", "dep:tokio", "dep:axum"]
# Points inside the store's compressed-ledger code at which a test can act
# (`protoledger::store::testing`). Never on by default: without it the module
# does not exist and the points compile to nothing. The crate's own tests
# turn it on through the dev-dependency on itself below.
test-hooks = ["store"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"], optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
hex = "0.4"
notify = { version = "8", optional = true }
rusqlite = { version = ">=0.31, <0.33", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
# raw_value: a native record is held as its exact bytes (SPEC §4). No other
# serde_json feature: protoledger must not change how a dependent's serde_json
# behaves, so preserve_order and arbitrary_precision stay off.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"], optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tempfile = "3"
walkdir = "2"
zstd = { version = "0.13", optional = true }

[dev-dependencies]
# The crate itself, with the test hooks: its tests (tests/compress.rs,
# tests/dict.rs) drive crashes and races through them. A dev-dependency
# reaches only test builds, so `cargo build` never has the feature.
protoledger = { path = ".", default-features = false, features = ["test-hooks"] }
# A blocking WebSocket client for tests/serve.rs (no tokio in the tests).
tungstenite = "0.26"
